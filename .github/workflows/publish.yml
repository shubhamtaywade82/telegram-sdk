name: Publish

# Manual npm publish with provenance via npm trusted publishing (OIDC). No npm
# token is used. The trusted-publisher entry on npmjs.com must name `publish.yml`
# with environment `publish`. Runs only when triggered from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest or next)'
        required: false
        default: latest

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0

      - run: npm ci --ignore-scripts

      - name: Verify the working tree is clean after build artifacts
        run: npm run build

      - name: Full test suite (offline)
        run: node --test dist/tests/*.test.js
        timeout-minutes: 5

      # The package's prepublishOnly is `npm test`. --ignore-scripts skips it,
      # so the same gate runs here, before the publish.
      - name: Package test gate (prepublishOnly equivalent)
        run: npm test

      - name: Pack and publish (trusted publishing)
        env:
          NPM_DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG" --ignore-scripts
