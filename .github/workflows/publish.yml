name: Publish

# Called by release-please.yml only. That file must be the trusted-publisher
# entry on npmjs.com, because trusted publishing validates the calling workflow.
# Publishes with npm trusted publishing (OIDC): no npm token is used.
on:
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted-publisher environment on npmjs.com must be `publish`.
    environment: publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0

      - name: Validate dist-tag
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          if [[ ! "$NPM_DIST_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::Invalid npm dist-tag '$NPM_DIST_TAG'. Refusing to publish."
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Full test suite (offline)
        run: node --test dist/tests/*.test.js
        timeout-minutes: 5

      # The package's prepublishOnly is `npm test`. --ignore-scripts skips it,
      # so the same gate runs here, before the publish.
      - name: Package test gate (prepublishOnly equivalent)
        run: npm test

      - name: Pack and publish (trusted publishing)
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG" --ignore-scripts
