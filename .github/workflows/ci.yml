name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # enables the manual live-conformance job below

permissions:
  contents: read

# superseded PR runs are cancelled; main-branch runs always complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (src + tests, strict)
        run: npm run typecheck

      - name: Bot API generated sources are up to date
        run: npm run check:botapi

      - name: Typecheck examples
        run: npx tsc -p tsconfig.examples.json

      - name: Build
        run: npm run build

      - name: Unit + mock-server tests
        run: node --test dist/tests/*.test.js
        timeout-minutes: 5

      - name: Docs build
        if: matrix.node-version == 22
        run: npm run docs

  live-conformance:
    # The real end-to-end check against production Telegram: a full auth-key
    # handshake AND one encrypted RPC round-trip through the whole client
    # (invokeWithLayer(initConnection(updates.getState))). No account needed -
    # the expected pre-login answer is an rpc_error (AUTH_KEY_UNREGISTERED),
    # which still proves the entire encrypted request/response cycle.
    # Manual-only (network-dependent, rate-limit friendly): run it from the
    # Actions tab. It FAILS the job on error - no silent continue-on-error.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/live.test.js
        timeout-minutes: 5
        env:
          MTPROTO_LIVE: '1'
